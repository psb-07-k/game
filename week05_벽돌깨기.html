<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>벽돌깨기 게임 - 특수벽돌 & 멀티볼</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        canvas {
            border: 2px solid black;
            background: #f9f9f9;
        }
    </style>
</head>

<body>

    <h1>벽돌깨기 게임</h1>

    <p>
        점수: <span id="score">0</span> |
        목숨: <span id="lives">3</span>
    </p>

    <p>조작: ← / → 방향키 | 🟢 초록 아이템: 공 3개 분할!</p>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreText = document.getElementById("score");
        const livesText = document.getElementById("lives");

        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let animationId;

        const paddle = {
            width: 100,
            height: 15,
            x: canvas.width / 2 - 50,
            y: canvas.height - 30,
            speed: 6
        };

        function drawPaddle() {
            ctx.fillStyle = "#333";
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
        }

        const keys = {};

        document.addEventListener("keydown", function (event) {
            keys[event.key] = true;
        });

        document.addEventListener("keyup", function (event) {
            keys[event.key] = false;
        });

        function movePaddle() {
            if (keys["ArrowLeft"]) {
                paddle.x -= paddle.speed;
            }
            if (keys["ArrowRight"]) {
                paddle.x += paddle.speed;
            }
            if (paddle.x < 0) {
                paddle.x = 0;
            }
            if (paddle.x + paddle.width > canvas.width) {
                paddle.x = canvas.width - paddle.width;
            }
        }

        // --- 다중 공 관리 (배열 사용) ---
        let balls = [];

        function createBall(x, y, dx, dy) {
            return {
                x: x,
                y: y,
                radius: 8,
                dx: dx,
                dy: dy
            };
        }

        function drawBalls() {
            balls.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = "tomato";
                ctx.fill();
                ctx.closePath();
            });
        }

        function moveBalls() {
            if (isGameOver) return;

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                b.x += b.dx;
                b.y += b.dy;

                // 좌우 벽 충돌
                if (b.x - b.radius < 0 || b.x + b.radius > canvas.width) {
                    b.dx *= -1;
                }

                // 천장 충돌
                if (b.y - b.radius < 0) {
                    b.dy *= -1;
                }

                // 패들 충돌
                if (
                    b.x + b.radius > paddle.x &&
                    b.x - b.radius < paddle.x + paddle.width &&
                    b.y + b.radius > paddle.y &&
                    b.y - b.radius < paddle.y + paddle.height
                ) {
                    b.dy = -Math.abs(b.dy);
                }

                // 바닥 낙하 처리
                if (b.y - b.radius > canvas.height) {
                    balls.splice(i, 1); // 해당 공 제거

                    // 남아있는 공이 없으면 목숨 차감
                    if (balls.length === 0) {
                        lives--;
                        livesText.textContent = lives;

                        if (lives <= 0) {
                            isGameOver = true;
                            gameOver();
                        } else {
                            resetBallandPaddle();
                        }
                    }
                }
            }
        }

        function resetBallandPaddle() {
            paddle.x = canvas.width / 2 - paddle.width / 2;
            balls = [createBall(canvas.width / 2, canvas.height - 50, 2.5, -2.5)];
        }

        // --- 아이템 관리 ---
        let items = [];

        function spawnItem(x, y) {
            // 15% 확률로 멀티볼 아이템 생성
            if (Math.random() < 0.15) {
                items.push({
                    x: x,
                    y: y,
                    width: 20,
                    height: 20,
                    dy: 2
                });
            }
        }

        function updateItems() {
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += item.dy;

                // 아이템 그리기 (초록색 +3 텍스트)
                ctx.fillStyle = "#2ecc71";
                ctx.fillRect(item.x, item.y, item.width, item.height);
                ctx.fillStyle = "white";
                ctx.font = "bold 11px Arial";
                ctx.textAlign = "center";
                ctx.fillText("+3", item.x + 10, item.y + 14);

                // 패들과 충돌 처리 (아이템 획득)
                if (
                    item.x < paddle.x + paddle.width &&
                    item.x + item.width > paddle.x &&
                    item.y < paddle.y + paddle.height &&
                    item.y + item.height > paddle.y
                ) {
                    // 공 2개 추가 생성 (다중 공 발동)
                    if (balls.length > 0) {
                        const baseBall = balls[0];
                        balls.push(createBall(baseBall.x, baseBall.y, -3, -2));
                        balls.push(createBall(baseBall.x, baseBall.y, 3, -2));
                    }
                    items.splice(i, 1);
                } else if (item.y > canvas.height) {
                    items.splice(i, 1); // 화면 밖 제거
                }
            }
        }

        function gameOver() {
            cancelAnimationFrame(animationId);
            setTimeout(() => {
                alert("게임 오버!");
                document.location.reload();
            }, 100);
        }

        // --- 벽돌 설정 ---
        const brick = {
            row: 4,
            column: 8,
            width: 60,
            height: 20,
            padding: 10,
            offsetTop: 40,
            offsetLeft: 25
        };

        const rowConfigs = [
            { color: "#e74c3c", score: 4, hp: 2 }, // 1행: 빨강 (내구도 2, 2번 쳐야 깨짐)
            { color: "#e67e22", score: 3, hp: 1 }, // 2행: 주황
            { color: "#f1c40f", score: 2, hp: 1 }, // 3행: 노랑
            { color: "#3498db", score: 1, hp: 1 }  // 4행: 파랑
        ];

        const bricks = [];
        let totalBricksCount = 0; // 남아있는 벽돌 카운트

        for (let r = 0; r < brick.row; r++) {
            bricks[r] = [];
            const bombCol = Math.floor(Math.random() * brick.column); // 줄마다 1개 폭탄벽돌 지정

            for (let c = 0; c < brick.column; c++) {
                const config = rowConfigs[r % rowConfigs.length];
                const isBomb = (c === bombCol);

                bricks[r][c] = {
                    x: 0,
                    y: 0,
                    visible: true,
                    color: config.color,
                    score: config.score,
                    hp: config.hp,
                    maxHp: config.hp,
                    isBomb: isBomb // 폭탄 특수벽돌 여부
                };
                totalBricksCount++;
            }
        }

        function drawBricks() {
            for (let r = 0; r < brick.row; r++) {
                for (let c = 0; c < brick.column; c++) {
                    const b = bricks[r][c];

                    if (b.visible) {
                        const brickX = c * (brick.width + brick.padding) + brick.offsetLeft;
                        const brickY = r * (brick.height + brick.padding) + brick.offsetTop;

                        b.x = brickX;
                        b.y = brickY;

                        // 색상 표현 (내구도 2인 벽돌이 1번 맞았을 때 색 연해짐)
                        if (b.hp === 1 && b.maxHp === 2) {
                            ctx.fillStyle = "#f1948a"; // 연분홍
                        } else {
                            ctx.fillStyle = b.color;
                        }

                        ctx.fillRect(brickX, brickY, brick.width, brick.height);

                        // 폭탄 특수벽돌은 검은색 테두리 표시
                        if (b.isBomb) {
                            ctx.strokeStyle = "black";
                            ctx.lineWidth = 2;
                            ctx.strokeRect(brickX, brickY, brick.width, brick.height);
                        }
                    }
                }
            }
        }

        // 폭탄 벽돌 터질 때 주변 3x3 범위 폭발 처리
        function triggerBombExplosion(startR, startC) {
            for (let r = Math.max(0, startR - 1); r <= Math.min(brick.row - 1, startR + 1); r++) {
                for (let c = Math.max(0, startC - 1); c <= Math.min(brick.column - 1, startC + 1); c++) {
                    const target = bricks[r][c];
                    if (target.visible) {
                        target.visible = false;
                        score += target.score;
                        totalBricksCount--;
                        spawnItem(target.x + brick.width / 2, target.y);
                    }
                }
            }
        }

        function checkBrickCollision() {
            for (let r = 0; r < brick.row; r++) {
                for (let c = 0; c < brick.column; c++) {
                    const b = bricks[r][c];

                    if (b.visible) {
                        balls.forEach(ball => {
                            if (
                                ball.x + ball.radius > b.x &&
                                ball.x - ball.radius < b.x + brick.width &&
                                ball.y + ball.radius > b.y &&
                                ball.y - ball.radius < b.y + brick.height
                            ) {
                                ball.dy *= -1;
                                b.hp--;

                                // 내구도가 다 되었을 때 깨짐
                                if (b.hp <= 0) {
                                    b.visible = false;
                                    score += b.score;
                                    totalBricksCount--;
                                    spawnItem(b.x + brick.width / 2, b.y);

                                    // 폭탄 벽돌이면 주변 폭발
                                    if (b.isBomb) {
                                        triggerBombExplosion(r, c);
                                    }
                                }

                                scoreText.textContent = score;

                                // 모든 벽돌을 깼을 때
                                if (totalBricksCount <= 0) {
                                    isGameOver = true;
                                    gameClear();
                                }
                            }
                        });
                    }
                }
            }
        }

        function gameClear() {
            cancelAnimationFrame(animationId);
            setTimeout(() => {
                alert(`축하합니다! 모든 벽돌을 깼습니다! (최종 점수: ${score}점)`);
                document.location.reload();
            }, 100);
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            movePaddle();
            drawPaddle();

            drawBalls();
            moveBalls();

            updateItems();

            drawBricks();
            checkBrickCollision();

            if (!isGameOver) {
                animationId = requestAnimationFrame(drawGame);
            }
        }

        // 최초 공 1개 생성 및 게임 시작
        resetBallandPaddle();
        drawGame();
    </script>

</body>

</html>
